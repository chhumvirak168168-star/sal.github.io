<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ហាងលក់ខោអាវអនឡាញ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Khmer OS Battambang', sans-serif; }
        body { background: #f4f4f4; color: #333; }
        header { background: #232f3e; color: white; padding: 20px; text-align: center; }
        .container { max-width: 1200px; margin: 20px auto; padding: 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .product-card img { max-width: 100%; height: 250px; object-fit: cover; border-radius: 5px; }
        .product-title { font-size: 18px; margin: 10px 0; font-weight: bold; }
        .product-price { color: #b12704; font-size: 16px; margin-bottom: 10px; }
        .order-btn { background: #ffd814; border: 1px solid #fcd200; padding: 10px 20px; cursor: pointer; border-radius: 20px; font-weight: bold; text-decoration: none; color: black; display: inline-block; }
        .order-btn:hover { background: #f7ca00; }
        footer { background: #232f3e; color: white; text-align: center; padding: 15px; margin-top: 30px; }
    </style>
</head>
<body>

<header>
    <h1>សូមស្វាគមន៍មកកាន់ ហាងខោអាវទាន់សម័យ</h1>
    <p>មានលក់ខោអាវបុរស នារី គុណភាពខ្ពស់ តម្លៃសមរម្យ</p>
</header>

<div class="container">
    <!-- ផលិតផលទី ១ -->
    <div class="product-card">
        <img src="https://unsplash.com" alt="អាវយឺត">
        <div class="product-title">អាវយឺតដៃខ្លី បុរស</div>
        <div class="product-price">$10.00</div>
        <!-- ជំនួសលេខទូរស័ព្ទរបស់អ្នកចូលកន្លែង phone=855... -->
        <a href="https://wa.me្ញុំចង់ទិញ អាវយឺតដៃខ្លី បុរស តម្លៃ $10" target="_blank" class="order-btn">កម្មង់ទិញតាម WhatsApp</a>
    </div>

    <!-- ផលិតផលទី ២ -->
    <div class="product-card">
        <img src="https://unsplash.com" alt="អាវសេរី">
        <div class="product-title">អាវសវមីដៃវែង</div>
        <div class="product-price">$15.00</div>
        <a href="https://wa.me្ញុំចង់ទិញ អាវសវមីដៃវែង តម្លៃ $15" target="_blank" class="order-btn">កម្មង់ទិញតាម WhatsApp</a>
    </div>

    <!-- ផលិតផលទី ៣ -->
    <div class="product-card">
        <img src="https://unsplash.com" alt="ខោខូវប៊យ">
        <div class="product-title">ខោខូវប៊យបុរស</div>
        <div class="product-price">$20.00</div>
        <a href="https://wa.me្ញុំចង់ទិញ ខោខូវប៊យបុរស តម្លៃ $20" target="_blank" class="order-btn">កម្មង់ទិញតាម WhatsApp</a>
    </div>
</div>

<footer>
    <p>© 2026 រក្សាសិទ្ធិដោយ ហាងខោអាវទាន់សម័យ</p>
</footer>

</body>
</html>
